<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nếp Studio · Architectural Monograph (9 Bố cục)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-paper: #F3F0E8;
      --bg-limestone: #EAE6DC;
      --ink-charcoal: #1A1B18;
      --ink-muted: #5C5E58;
      --accent-moss: #3E4A36;
      --accent-moss-hover: #2F3929;
      --rule-hairline: #D6D1C6;
      --font-display: 'Newsreader', Georgia, serif;
      --font-sans: 'Be Vietnam Pro', system-ui, -apple-system, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      border-radius: 0 !important;
      box-shadow: none !important;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: #E5E0D5;
      color: var(--ink-charcoal);
      font-family: var(--font-sans);
      font-size: 16px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    .tabular { font-variant-numeric: tabular-nums; }
    .serif { font-family: var(--font-display); }

    a, button, summary {
      cursor: pointer;
      color: inherit;
      font-family: inherit;
    }

    a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible {
      outline: 2px solid var(--accent-moss);
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }

    /* Top Studio Switcher Bar */
    .studio-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #1A1B18;
      color: #F3F0E8;
      border-bottom: 1px solid #333530;
      padding: 8px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 13px;
    }

    .studio-bar.is-collapsed .studio-controls { display: none; }
    .studio-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .bar-btn {
      background: transparent;
      color: #D6D1C6;
      border: 1px solid #454740;
      padding: 5px 10px;
      font-size: 12px;
      min-height: 30px;
      transition: background-color 180ms ease, color 180ms ease;
    }
    .bar-btn:hover { background: #2B2D28; color: #F3F0E8; }
    .bar-btn.active { background: var(--accent-moss); color: #F3F0E8; border-color: var(--accent-moss); }

    /* Stage */
    .stage {
      padding: 24px 20px 64px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
      gap: 24px;
    }

    @media (min-width: 1100px) and (max-width: 1439px) {
      .stage.mode-both { flex-wrap: nowrap; }
      .stage.mode-both .frame-desktop { zoom: 0.74; }
    }
    @media (min-width: 1440px) and (max-width: 1760px) {
      .stage.mode-both { flex-wrap: nowrap; }
      .stage.mode-both .frame-desktop { zoom: 0.90; }
    }

    .viewport-wrap {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .viewport-label {
      font-size: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink-muted);
    }

    .frame-desktop {
      width: 1280px;
      max-width: 100%;
      background: var(--bg-paper);
      border: 1px solid var(--rule-hairline);
      overflow-x: hidden;
    }

    .frame-mobile {
      width: 390px;
      max-width: 100%;
      background: var(--bg-paper);
      border: 1px solid var(--rule-hairline);
      overflow-x: hidden;
    }

    .is-hidden { display: none !important; }

    /* Site Shell */
    .skip-link {
      position: absolute;
      left: -9999px;
      top: 0;
      background: var(--accent-moss);
      color: #F3F0E8;
      padding: 10px 16px;
      z-index: 50;
    }
    .skip-link:focus { left: 16px; top: 16px; }

    .site-header {
      border-bottom: 1px solid var(--rule-hairline);
      background: var(--bg-paper);
    }

    .header-inner {
      max-width: 1120px;
      margin: 0 auto;
      padding: 20px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      position: relative;
    }

    .mobile-mode .header-inner {
      padding: 14px 20px;
    }

    .brand-link {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 500;
      text-decoration: none;
      letter-spacing: -0.01em;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
    }

    .desktop-nav {
      display: flex;
      align-items: center;
      gap: 28px;
      font-size: 15px;
    }

    .nav-item, .nav-dropdown-btn {
      background: transparent;
      border: none;
      padding: 8px 0;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      color: var(--ink-charcoal);
      font-size: 15px;
      border-bottom: 1px solid transparent;
      transition: border-color 180ms ease, color 180ms ease;
    }

    .nav-item:hover, .nav-dropdown-btn:hover { color: var(--accent-moss); }
    .nav-item.active, .nav-dropdown-btn.active { border-bottom-color: var(--ink-charcoal); }

    .dropdown-wrap { position: relative; }
    .dropdown-menu {
      position: absolute;
      top: 100%;
      left: 0;
      min-width: 220px;
      background: var(--bg-paper);
      border: 1px solid var(--rule-hairline);
      z-index: 40;
      display: none;
      flex-direction: column;
    }
    .dropdown-menu.open { display: flex; }
    .dropdown-link {
      padding: 12px 16px;
      min-height: 44px;
      text-decoration: none;
      font-size: 14px;
      border-bottom: 1px solid var(--rule-hairline);
      background: var(--bg-paper);
      text-align: left;
      border-left: none;
      border-right: none;
      border-top: none;
    }
    .dropdown-link:last-child { border-bottom: none; }
    .dropdown-link:hover, .dropdown-link.active { background: var(--bg-limestone); }

    /* Mobile Menu Button & Drawer */
    .mobile-menu-btn {
      background: transparent;
      border: 1px solid var(--rule-hairline);
      padding: 8px 16px;
      min-height: 44px;
      min-width: 72px;
      font-size: 15px;
    }
    .mobile-drawer {
      display: none;
      flex-direction: column;
      border-top: 1px solid var(--rule-hairline);
      background: var(--bg-paper);
      padding: 8px 20px 16px;
    }
    .mobile-drawer.open { display: flex; }
    .mobile-nav-link, .mobile-sub-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      min-height: 44px;
      padding: 10px 0;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--rule-hairline);
      text-decoration: none;
      font-size: 15px;
      text-align: left;
    }
    .mobile-sub-list {
      display: none;
      flex-direction: column;
      padding-left: 16px;
      background: var(--bg-limestone);
    }
    .mobile-sub-list.open { display: flex; }
    .mobile-sub-link {
      display: flex;
      align-items: center;
      min-height: 44px;
      padding: 8px 12px;
      text-decoration: none;
      font-size: 14px;
      border-bottom: 1px solid var(--rule-hairline);
    }

    /* Main Containers */
    .container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 56px 32px;
    }
    .mobile-mode .container {
      padding: 32px 20px;
    }

    .section-rule {
      border-top: 1px solid var(--rule-hairline);
      padding-top: 48px;
      margin-top: 48px;
    }
    .mobile-mode .section-rule {
      padding-top: 32px;
      margin-top: 32px;
    }

    /* Typography */
    h1, h2, h3 {
      font-family: var(--font-display);
      font-weight: 400;
      line-height: 1.2;
      margin: 0 0 16px;
      letter-spacing: -0.015em;
    }
    h1 { font-size: 44px; }
    .mobile-mode h1 { font-size: 32px; }
    h2 { font-size: 30px; }
    .mobile-mode h2 { font-size: 24px; }
    h3 { font-size: 22px; }
    p { margin: 0 0 16px; color: var(--ink-charcoal); }
    .muted { color: var(--ink-muted); }
    .eyebrow {
      font-size: 13px;
      color: var(--ink-muted);
      letter-spacing: 0.04em;
      margin-bottom: 12px;
      display: block;
    }

    /* Buttons & Links */
    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--accent-moss);
      color: #F3F0E8;
      border: 1px solid var(--accent-moss);
      padding: 12px 24px;
      min-height: 48px;
      font-size: 15px;
      font-weight: 500;
      text-decoration: none;
      transition: background-color 180ms ease;
    }
    .btn-primary:hover { background: var(--accent-moss-hover); }

    .btn-outline {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      color: var(--ink-charcoal);
      border: 1px solid var(--ink-charcoal);
      padding: 12px 24px;
      min-height: 48px;
      font-size: 15px;
      font-weight: 500;
      text-decoration: none;
      transition: background-color 180ms ease;
    }
    .btn-outline:hover { background: var(--bg-limestone); }

    .text-link {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      color: var(--ink-charcoal);
      text-decoration: underline;
      text-underline-offset: 4px;
      text-decoration-thickness: 1px;
      font-size: 15px;
      background: transparent;
      border: none;
      padding: 0;
    }
    .text-link:hover { color: var(--accent-moss); }

    .actions-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 20px;
      margin-top: 24px;
    }

    /* Images */
    .photo {
      display: block;
      width: 100%;
      height: auto;
      object-fit: cover;
    }

    /* Grids */
    .grid-hero {
      display: grid;
      grid-template-columns: 35% 1fr;
      gap: 48px;
      align-items: center;
    }
    .mobile-mode .grid-hero {
      grid-template-columns: 1fr;
      gap: 24px;
    }
    .mobile-mode .grid-hero .hero-media { order: -1; }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 48px;
      align-items: start;
    }
    .mobile-mode .grid-2 {
      grid-template-columns: 1fr;
      gap: 28px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 36px;
    }
    .mobile-mode .grid-3 {
      grid-template-columns: 1fr;
      gap: 24px;
    }

    /* Spec Bar (02) */
    .spec-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-top: 1px solid var(--rule-hairline);
      border-bottom: 1px solid var(--rule-hairline);
      margin: 24px 0 36px;
    }
    .mobile-mode .spec-bar {
      grid-template-columns: 1fr 1fr;
    }
    .spec-cell {
      padding: 16px 16px 16px 0;
      border-right: 1px solid var(--rule-hairline);
    }
    .spec-cell:last-child { border-right: none; }
    .mobile-mode .spec-cell:nth-child(2n) { border-right: none; padding-left: 16px; }
    .mobile-mode .spec-cell:nth-child(1),
    .mobile-mode .spec-cell:nth-child(2) { border-bottom: 1px solid var(--rule-hairline); }
    .spec-cell:not(:first-child) { padding-left: 16px; }
    .mobile-mode .spec-cell:nth-child(3) { padding-left: 0; }
    .spec-label { font-size: 13px; color: var(--ink-muted); margin-bottom: 4px; }
    .spec-val { font-size: 16px; font-weight: 500; }

    /* Fee Schedule (03) */
    .fee-row {
      display: grid;
      grid-template-columns: 1.4fr 0.8fr;
      gap: 48px;
      padding: 36px 0;
      border-top: 1px solid var(--rule-hairline);
      align-items: start;
      transition: border-color 0.25s ease, background-color 0.25s ease;
    }
    .fee-row:last-of-type { border-bottom: 1px solid var(--rule-hairline); }
    .fee-row.is-highlighted {
      border: 1px solid var(--accent-moss);
      border-left: 3px solid var(--accent-moss);
      padding: 36px 24px;
      background: rgba(62, 74, 54, 0.04);
    }
    .mobile-mode .fee-row {
      grid-template-columns: 1fr;
      gap: 20px;
      padding: 28px 0;
    }
    .mobile-mode .fee-row.is-highlighted {
      padding: 24px 16px;
    }
    .fee-num { font-size: 13px; color: var(--ink-muted); margin-bottom: 6px; display: block; }
    .fee-price { font-size: 24px; font-family: var(--font-display); margin-bottom: 8px; }
    .fee-meta { font-size: 14px; color: var(--ink-muted); margin-bottom: 12px; }
    .fee-example {
      border-left: 2px solid var(--rule-hairline);
      padding-left: 12px;
      font-size: 14px;
      color: var(--ink-muted);
      margin: 12px 0 20px;
    }

    /* Booking Form (04) */
    .booking-grid {
      display: grid;
      grid-template-columns: 4fr 8fr;
      gap: 56px;
      align-items: start;
    }
    .mobile-mode .booking-grid {
      grid-template-columns: 1fr;
      gap: 24px;
    }
    .summary-box {
      background: var(--bg-limestone);
      padding: 28px;
    }
    .mobile-summary-line {
      border-top: 1px solid var(--rule-hairline);
      border-bottom: 1px solid var(--rule-hairline);
      padding: 12px 0;
      margin-bottom: 24px;
    }
    .mobile-summary-trigger {
      width: 100%;
      background: transparent;
      border: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 44px;
      font-size: 14px;
      padding: 0;
      text-align: left;
    }
    .mobile-summary-detail {
      display: none;
      padding-top: 12px;
      font-size: 14px;
      color: var(--ink-muted);
    }
    .mobile-summary-detail.open { display: block; }

    .field { margin-bottom: 24px; }
    .field label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 6px;
    }
    .field input, .field select, .field textarea {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--rule-hairline);
      padding: 10px 0;
      min-height: 44px;
      font-family: var(--font-sans);
      font-size: 16px;
      color: var(--ink-charcoal);
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      outline: none;
      border-bottom-color: var(--accent-moss);
    }
    .radio-row {
      display: flex;
      gap: 24px;
      padding: 8px 0;
    }
    .radio-opt {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 44px;
      font-size: 15px;
      cursor: pointer;
    }
    .radio-opt input, input[type="radio"] {
      width: auto;
      min-height: auto;
      border: none;
      accent-color: var(--accent-moss);
    }

    .error-msg {
      color: #8A2C2C;
      font-size: 13px;
      margin-top: 6px;
      display: none;
    }
    .error-msg.show { display: block; }

    .confirm-box {
      background: var(--bg-limestone);
      border-left: 2px solid var(--accent-moss);
      padding: 28px;
    }

    /* FAQ Accordion */
    details.faq-item {
      border-top: 1px solid var(--rule-hairline);
      padding: 16px 0;
    }
    details.faq-item:last-of-type { border-bottom: 1px solid var(--rule-hairline); }
    details.faq-item summary {
      list-style: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 44px;
      font-weight: 500;
      font-size: 16px;
    }
    details.faq-item summary::-webkit-details-marker { display: none; }
    details.faq-item summary::after {
      content: '+';
      font-size: 18px;
      font-weight: 400;
      color: var(--ink-muted);
      flex-shrink: 0;
    }
    details.faq-item[open] summary::after {
      content: '−';
      color: var(--ink-charcoal);
    }
    details.faq-item p {
      margin-top: 10px;
      color: var(--ink-muted);
      font-size: 15px;
    }

    /* Contact 09 Mobile order */
    .contact-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 56px;
      align-items: center;
    }
    .mobile-mode .contact-grid {
      grid-template-columns: 1fr;
      gap: 28px;
    }

    /* CTA Limestone Band */
    .cta-band {
      background: var(--bg-limestone);
      padding: 36px;
      margin-top: 48px;
    }
    .mobile-mode .cta-band {
      padding: 24px 20px;
      margin-top: 32px;
    }

    /* Footer */
    .site-footer {
      border-top: 1px solid var(--rule-hairline);
      background: var(--bg-paper);
    }
    .footer-inner {
      max-width: 1120px;
      margin: 0 auto;
      padding: 32px;
    }
    .mobile-mode .footer-inner { padding: 28px 20px; }
    .footer-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
    }
    .mobile-mode .footer-top {
      flex-direction: column;
      align-items: flex-start;
      gap: 0;
    }
    .footer-group {
      display: flex;
      align-items: center;
      gap: 24px;
    }
    .mobile-mode .footer-group {
      flex-direction: column;
      align-items: flex-start;
      gap: 0;
      width: 100%;
    }
    .footer-link {
      text-decoration: none;
      font-size: 14px;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
    }
    .footer-link:hover { text-decoration: underline; text-underline-offset: 4px; }
    .footer-note {
      margin-top: 16px;
      font-size: 12px;
      color: var(--ink-muted);
    }

    .prose { max-width: 66ch; }
    .prose p { font-size: 17px; line-height: 1.75; }
    .mobile-mode .prose p { font-size: 16px; }
  </style>
</head>
<body>

  <div class="studio-bar" id="studioBar">
    <div style="display:flex;align-items:center;gap:12px;">
      <strong>Nếp Studio · Architectural Monograph</strong>
      <button type="button" class="bar-btn" data-action="toggle-bar">Thu gọn thanh</button>
    </div>
    <div class="studio-controls">
      <button type="button" class="bar-btn" data-set-page="01">01 Trang chủ</button>
      <button type="button" class="bar-btn" data-set-page="02">02 Chi tiết dự án</button>
      <button type="button" class="bar-btn" data-set-page="03">03 Dịch vụ &amp; Giá</button>
      <button type="button" class="bar-btn" data-set-page="04">04 Đặt lịch</button>
      <button type="button" class="bar-btn" data-set-page="05">05 Giới thiệu</button>
      <button type="button" class="bar-btn" data-set-page="06">06 Bộ sưu tập</button>
      <button type="button" class="bar-btn" data-set-page="07">07 Blog &amp; FAQ</button>
      <button type="button" class="bar-btn" data-set-page="08">08 Chi tiết bài</button>
      <button type="button" class="bar-btn" data-set-page="09">09 Liên hệ</button>
      <span style="opacity:0.4;padding:0 4px;">|</span>
      <button type="button" class="bar-btn active" data-set-mode="both">Song song</button>
      <button type="button" class="bar-btn" data-set-mode="desktop">Máy tính 1280</button>
      <button type="button" class="bar-btn" data-set-mode="mobile">Điện thoại 390</button>
    </div>
  </div>

  <main class="stage mode-both" id="stageMain">
    <div class="viewport-wrap" data-viewport="desktop">
      <span class="viewport-label">Máy tính · 1280px</span>
      <div class="frame-desktop" data-frame="desktop"></div>
    </div>
    <div class="viewport-wrap" data-viewport="mobile">
      <span class="viewport-label">Điện thoại · 390px</span>
      <div class="frame-mobile mobile-mode" data-frame="mobile"></div>
    </div>
  </main>

  <script>
    const PRICING_CONFIG = {
      G01: { unitPrice: 1500000, minPrice: 1500000 },
      G02: { unitPrice: 250000, minPrice: 9000000 },
      G03: { unitPrice: 1200000, minPrice: 1200000, bundleSessions: 2 }
    };

    const SAMPLE_AREAS = {
      hienNang: 62,
      smallApt: 32
    };

    function formatVnd(amount) {
      return `${Number(amount).toLocaleString('vi-VN')} đ`;
    }

    function calcG02Fee(area) {
      return Math.max(area * PRICING_CONFIG.G02.unitPrice, PRICING_CONFIG.G02.minPrice);
    }

    const G02_MIN_THRESHOLD_AREA = Math.ceil(PRICING_CONFIG.G02.minPrice / PRICING_CONFIG.G02.unitPrice);
    const G03_BUNDLE_PRICE = PRICING_CONFIG.G03.unitPrice * PRICING_CONFIG.G03.bundleSessions;

    const PACKAGES = {
      G01: {
        code: 'G01',
        name: 'Tư vấn bố trí mặt bằng',
        price: `${formatVnd(PRICING_CONFIG.G01.unitPrice)}/căn`,
        scope: 'Một buổi trực tuyến 60 phút cho căn hộ đến 70 m². Khách gửi mặt bằng có kích thước và ảnh hiện trạng. Sau buổi, nhận 1 sơ đồ bố trí có chú thích và 1 lượt góp ý chỉnh sơ đồ.',

              <p>Một chiếc bàn có thể vừa với khoảng sàn trống mà vẫn vướng lúc dùng. Điều đáng thử là chuyện xảy ra đúng giờ cơm: một người đang ngồi, người kia bê tô canh từ bếp ra, rồi cả hai cùng đứng dậy.</p>
              <p><strong>Đánh dấu mặt bàn trên sàn.</strong> Dùng băng giấy đánh dấu bốn góc theo kích thước bàn bạn đang cân nhắc. Lấy một chiếc ghế đang dùng, đặt vào đúng phía bạn định ngồi rồi kéo ra như khi rời bàn. Giữ ghế ở đó và đi thử từ bếp qua. Chính động tác kéo ghế mới cho thấy phần sàn bạn cần chừa.</p>
              <p><strong>Thử một bữa thường và một bữa có khách.</strong> Đặt hai bát lên bàn cho bữa thường. Sau đó nghĩ đến người thứ ba, thứ tư: họ lấy ghế từ đâu, ai cần đứng lên để nhường đường? Trong phương án Hiên Nắng, băng ghế ở sẵn bên cửa sổ. Khi kê bàn về phía ấy, một chỗ đọc sách có thể trở thành một phía của bàn ăn.</p>
              <p><strong>Chụp lại chỗ bị vướng.</strong> Một tấm ảnh khi ghế đang kéo ra và một sơ đồ có kích thước hữu ích hơn ảnh căn phòng đã dọn gọn. Ghi thêm món đồ bạn muốn giữ. Khi trao đổi về mặt bằng, hai bên có thể bắt đầu từ đúng góc thường bất tiện nhất.</p>
            </div>
            <div class="cta-band" style="max-width:66ch;">
              <div class="actions-row" style="margin-top:0;">
                <a href="#02" class="btn-primary" data-nav="02">Xem góc bàn ăn Hiên Nắng</a>
                <a href="#03" class="text-link" data-nav="03">Xem gói Tư vấn bố trí mặt bằng</a>
              </div>
            </div>
          </section>`;
      }

      // Page 09: Liên hệ
      return `
        <section class="container">
          <div class="contact-grid">
            <div>
              <span class="eyebrow">Liên hệ</span>
              <h1>Trao đổi với Nếp</h1>
              <p class="muted">Bạn có thể gửi nhu cầu và chọn cách để studio liên hệ lại.</p>
              <div class="actions-row">
                <a href="#04" class="btn-primary" data-nav="04">Gửi yêu cầu tư vấn</a>
                <a href="#03" class="text-link" data-nav="03">Xem dịch vụ và bảng giá</a>
              </div>
            </div>
            <div>
              <img src="./assets/hien-nang-cua-so.jpg" alt="Cận cảnh gối tựa vải lanh bên khung cửa sổ ngập nắng" class="photo" />
            </div>
          </div>
        </section>`;
    }

    function renderAll() {
      const dFrame = document.querySelector('[data-frame="desktop"]');
      const mFrame = document.querySelector('[data-frame="mobile"]');
      dFrame.innerHTML = renderHeader(false) + `<div id="main-content">${renderPageContent(false)}</div>` + renderFooter();
      mFrame.innerHTML = renderHeader(true) + `<div>${renderPageContent(true)}</div>` + renderFooter();
      bindEvents();
      syncControlBar();
    }

    function syncControlBar() {
      document.querySelectorAll('[data-set-page]').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.setPage === state.page);
      });
      document.querySelectorAll('[data-set-mode]').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.setMode === state.mode);
      });
      const stageEl = document.getElementById('stageMain');
      if (stageEl) stageEl.classList.toggle('mode-both', state.mode === 'both');
      const dWrap = document.querySelector('[data-viewport="desktop"]');
      const mWrap = document.querySelector('[data-viewport="mobile"]');
      dWrap.classList.toggle('is-hidden', state.mode === 'mobile');
      mWrap.classList.toggle('is-hidden', state.mode === 'desktop');
    }

    function navigateTo(page, pkg, highlightPkg = '') {
      if (pkg !== undefined) state.selectedPkg = pkg;
      state.highlightPkg = page === '03' ? highlightPkg : '';
      state.page = page;
      state.bookingSubmitted = false;
      history.replaceState(null, '', `?page=${page}`);
      renderAll();
      if (page === '03' && highlightPkg) {
        requestAnimationFrame(() => {
          const targetRow = document.querySelector(`.viewport-wrap:not(.is-hidden) [data-pkg-row="${highlightPkg}"]`)
            || document.querySelector(`[data-pkg-row="${highlightPkg}"]`);
          if (targetRow) {
            targetRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
        });
      } else {
        window.scrollTo({ top: 0, behavior: 'auto' });
      }
    }

    function bindEvents() {
      document.querySelectorAll('[data-nav]').forEach(el => {
        el.addEventListener('click', (e) => {
          e.preventDefault();
          navigateTo(el.dataset.nav);
        });
      });

      document.querySelectorAll('[data-view-pkg]').forEach(el => {
        el.addEventListener('click', (e) => {
          e.preventDefault();
          navigateTo('03', undefined, el.dataset.viewPkg);
        });
      });

      document.querySelectorAll('[data-book-pkg]').forEach(el => {
        el.addEventListener('click', (e) => {
          e.preventDefault();
          navigateTo('04', el.dataset.bookPkg);
        });
      });

      // Desktop Dropdown with Keyboard Support (Enter/Space/Escape)
      document.querySelectorAll('[data-action="toggle-dropdown"]').forEach(btn => {
        const menu = btn.parentElement.querySelector('[data-dropdown-menu]');
        btn.addEventListener('click', () => {
          const isOpen = menu.classList.toggle('open');
          btn.setAttribute('aria-expanded', String(isOpen));
        });
        btn.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') {
            menu.classList.remove('open');
            btn.setAttribute('aria-expanded', 'false');
            btn.focus();
          }
        });
        menu.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') {
            menu.classList.remove('open');
            btn.setAttribute('aria-expanded', 'false');
            btn.focus();
          }
        });
      });

      // Mobile Menu Drawer
      document.querySelectorAll('[data-action="toggle-mobile-menu"]').forEach(btn => {
        const frame = btn.closest('[data-frame]');
        const drawer = frame.querySelector('[data-mobile-drawer]');
        btn.addEventListener('click', () => {
          const isOpen = drawer.classList.toggle('open');
          btn.setAttribute('aria-expanded', String(isOpen));
        });
      });

      document.querySelectorAll('[data-action="toggle-mobile-sub"]').forEach(btn => {
        const sub = btn.nextElementSibling;
        btn.addEventListener('click', () => {
          const isOpen = sub.classList.toggle('open');
          btn.setAttribute('aria-expanded', String(isOpen));
        });
      });

      // Mobile Booking Summary Toggle
      document.querySelectorAll('[data-action="toggle-mobile-summary"]').forEach(btn => {
        const detail = btn.parentElement.querySelector('[data-mobile-summary-detail]');
        btn.addEventListener('click', () => {
          const isOpen = detail.classList.toggle('open');
          btn.setAttribute('aria-expanded', String(isOpen));
        });
      });

      // Booking Form Sync & Submit (all viewports)
      document.querySelectorAll('[data-field]').forEach(input => {
        input.addEventListener('change', (e) => {
          const f = e.target.dataset.field;
          if (f === 'pkg') { state.selectedPkg = e.target.value; renderAll(); }
          if (f === 'area') state.bookingArea = e.target.value;
          if (f === 'name') state.bookingName = e.target.value;
          if (f === 'method') { state.bookingMethod = e.target.value; renderAll(); }
          if (f === 'contact') state.bookingContact = e.target.value;
          if (f === 'note') state.bookingNote = e.target.value;
          if (f === 'time') state.bookingTime = e.target.value;
        });
      });

      document.querySelectorAll('[data-action="booking-form"]').forEach(form => {
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          let valid = true;
          const pkgEl = form.querySelector('[data-field="pkg"]');
          const nameEl = form.querySelector('[data-field="name"]');
          const contactEl = form.querySelector('[data-field="contact"]');

          form.querySelectorAll('.error-msg').forEach(m => m.classList.remove('show'));

          if (!pkgEl.value) { form.querySelector('[data-error="pkg"]').classList.add('show'); valid = false; }
          if (!nameEl.value.trim()) { form.querySelector('[data-error="name"]').classList.add('show'); valid = false; }
          if (!contactEl.value.trim()) { form.querySelector('[data-error="contact"]').classList.add('show'); valid = false; }

          if (valid) {
            state.selectedPkg = pkgEl.value;
            state.bookingName = nameEl.value.trim();
            state.bookingContact = contactEl.value.trim();
            state.bookingSubmitted = true;
            renderAll();
          }
        });
      });

      document.querySelectorAll('[data-action="reset-booking"], [data-action="toggle-submitted-preview"]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.bookingSubmitted = !state.bookingSubmitted;
          renderAll();
        });
      });
    }

    // Studio Control Bar Events
    document.querySelectorAll('[data-set-page]').forEach(btn => {
      btn.addEventListener('click', () => navigateTo(btn.dataset.setPage));
    });
    document.querySelectorAll('[data-set-mode]').forEach(btn => {
      btn.addEventListener('click', () => {
        state.mode = btn.dataset.setMode;
        syncControlBar();
      });
    });
    document.querySelector('[data-action="toggle-bar"]').addEventListener('click', (e) => {
      const bar = document.getElementById('studioBar');
      const collapsed = bar.classList.toggle('is-collapsed');
      e.target.textContent = collapsed ? 'Mở thanh điều khiển' : 'Thu gọn thanh';
    });

    // Init from URL ?page= or #hash
    (function init() {
      const params = new URLSearchParams(window.location.search);
      const qPage = params.get('page') || window.location.hash.replace('#', '');
      if (qPage && /^0[1-9]$/.test(qPage)) state.page = qPage;
      renderAll();
    })();
  </script>
</body>
</html>
